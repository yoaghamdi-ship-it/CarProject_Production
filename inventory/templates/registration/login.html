<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <!-- مكتبة Bootstrap لتنسيق الصفحة -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h3 class="text-center mb-4 font-weight-bold">تسجيل الدخول</h3>

        <!-- عرض تنبيه في حال إدخال بيانات خاطئة -->
        {% if form.errors %}
            <div class="alert alert-danger text-center mb-3 py-2">
                اسم المستخدم أو كلمة المرور غير صحيحة.
            </div>
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            
            <!-- حقل اسم المستخدم -->
            <div class="mb-3">
                <label for="username" class="form-label">اسم المستخدم</label>
                <input type="text" name="username" id="username" class="form-control" placeholder="أدخل اسم المستخدم" required autofocus>
            </div>

            <!-- حقل كلمة المرور -->
            <div class="mb-3">
                <label for="password" class="form-label">كلمة المرور</label>
                <input type="password" name="password" id="password" class="form-control" placeholder="أدخل كلمة المرور" required>
            </div>

            <!-- زر تسجيل الدخول -->
            <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-primary">تسجيل الدخول</button>
            </div>
        </form>
    </div>

</body>
</html>
